  <rect x="22" y="156" width="8" height="2" fill="#8ae5c0"/>
  <rect x="34" y="148" width="8" height="2" fill="#8ae5c0"/>
  <rect x="46" y="142" width="8" height="2" fill="#8ae5c0"/>
