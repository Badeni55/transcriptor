<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — ReelScript</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f97316'/%3E%3Cstop offset='100%25' stop-color='%23fbbf24'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230a0b0f'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='15' fill='url(%23g)'%3ERS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0b0f; --surf: #111318; --surf2: #181b22;
      --border: rgba(255,255,255,0.08); --text: #f1f3f7;
      --text2: #8b92a5; --text3: #4a5168; --accent: #f97316;
      --accent-dim: rgba(249,115,22,0.15);
      --r: 14px; --rsm: 8px;
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(249,115,22,.2); color: #f97316; }
    .card {
      width: 100%; max-width: 400px;
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px 36px;
    }
    .card h1 {
      font-family: 'DM Serif Display', serif; font-size: 1.6rem; font-weight: 400;
      margin-bottom: 8px;
    }
    .card p { color: var(--text2); font-size: .88rem; margin-bottom: 28px; font-weight: 300; }
    label {
      display: block; font-size: .72rem; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px;
    }
    input {
      width: 100%; padding: 12px 14px; background: var(--surf2);
      border: 1px solid var(--border); border-radius: 10px;
      font-size: 16px; color: var(--text); font-family: 'DM Sans', sans-serif;
      outline: none; transition: border-color .2s; margin-bottom: 12px;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text3); }
    .btn-primary {
      width: 100%; padding: 13px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: all .2s; margin-bottom: 10px;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { background: var(--surf2); color: var(--text3); cursor: not-allowed; }
    .btn-secondary {
      width: 100%; padding: 11px; background: transparent;
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text3); font-size: .82rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: all .2s;
    }
    .btn-secondary:hover { border-color: var(--text3); color: var(--text2); }
    .err { font-size: .78rem; color: #f87171; margin-bottom: 12px; display: none; }
    .err.on { display: block; }
    .success { display: none; text-align: center; }
    .success.on { display: block; }
    .success-icon {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent-dim); border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 1.4rem; color: var(--accent);
    }
    .success h2 {
      font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400;
      margin-bottom: 8px;
    }
    .success p { color: var(--text2); font-size: .88rem; margin-bottom: 24px; font-weight: 300; }
    .success strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div id="formView">
      <h1>Reset your password</h1>
      <p>Enter your email and we'll send you a reset link.</p>
      <label>EMAIL</label>
      <input type="email" id="fpEmail" placeholder="you@example.com" />
      <div class="err" id="fpErr"></div>
      <button class="btn-primary" id="fpBtn" onclick="submitForgot()">Send reset link</button>
      <a href="/" class="btn-secondary" style="display:block;text-align:center;text-decoration:none">Back to login</a>
    </div>
    <div class="success" id="successView">
      <div class="success-icon">&#10003;</div>
      <h2>Check your inbox</h2>
      <p>We sent a reset link to <strong id="fpSuccessEmail"></strong>. It expires in 1 hour.</p>
      <a href="/" class="btn-secondary" style="display:block;text-align:center;text-decoration:none">Back to login</a>
    </div>
  </div>
<script>
async function submitForgot() {
  const email = document.getElementById("fpEmail").value.trim();
  const err = document.getElementById("fpErr");
  const btn = document.getElementById("fpBtn");
  err.classList.remove("on");
  if (!email) { err.textContent = "Email required"; err.classList.add("on"); return; }
  btn.disabled = true; btn.textContent = "Sending...";
  const res = await fetch("/auth/forgot-password", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email }),
  });
  const d = await res.json();
  if (!res.ok) {
    err.textContent = d.error || "Error"; err.classList.add("on");
    btn.disabled = false; btn.textContent = "Send reset link";
    return;
  }
  document.getElementById("formView").style.display = "none";
  document.getElementById("fpSuccessEmail").textContent = email;
  document.getElementById("successView").classList.add("on");
}
document.getElementById("fpEmail").addEventListener("keydown", e => { if (e.key === "Enter") submitForgot(); });
</script>
</body>
</html>
