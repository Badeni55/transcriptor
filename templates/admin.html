<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — ReelScript</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:              #f9f9f8;
      --surface:         #ffffff;
      --surface-raised:  #ffffff;
      --border-subtle:   #e8e8e5;
      --border-default:  #d4d4ce;
      --text-primary:    #1a1a18;
      --text-secondary:  #6b6b68;
      --text-tertiary:   #9b9b98;
      --brand-500:       #f97316;
      --radius-sm:       6px;
      --radius-md:       10px;
      --radius-lg:       16px;
      --shadow-sm:       0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:       0 4px 12px rgba(0,0,0,.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 24px 80px;
    }

    .page-header {
      max-width: 960px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .page-header .sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .refresh-btn {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      cursor: pointer;
      font-family: var(--font);
      transition: color .15s, border-color .15s;
    }
    .refresh-btn:hover { color: var(--text-primary); border-color: var(--text-primary); }

    .section { max-width: 960px; margin: 0 auto 40px; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 12px;
    }

    /* Metric cards grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }
    .metric-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      line-height: 1;
    }
    .metric-value.accent { color: var(--brand-500); }

    /* Plan breakdown */
    .plan-list { display: flex; flex-direction: column; gap: 8px; }
    .plan-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
    }
    .plan-name {
      font-size: 13px;
      font-weight: 500;
      min-width: 80px;
    }
    .plan-bar-wrap {
      flex: 1;
      height: 6px;
      background: var(--border-subtle);
      border-radius: 99px;
      overflow: hidden;
    }
    .plan-bar {
      height: 100%;
      background: var(--brand-500);
      border-radius: 99px;
      transition: width .4s ease;
    }
    .plan-count {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 28px;
      text-align: right;
    }

    /* Top users table */
    .top-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .top-table thead th {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      text-align: left;
      background: var(--bg);
      border-bottom: 1px solid var(--border-subtle);
    }
    .top-table td {
      padding: 11px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }
    .top-table tr:last-child td { border-bottom: none; }
    .top-table .rank {
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      width: 32px;
    }
    .top-table .count {
      font-weight: 600;
      text-align: right;
    }

    /* Loading / error states */
    .state-msg {
      font-size: 13px;
      color: var(--text-tertiary);
      padding: 24px 0;
      text-align: center;
    }
    .state-msg.error { color: #dc2626; }
  </style>
</head>
<body>

<div class="page-header">
  <div>
    <h1>Admin</h1>
    <div class="sub" id="lastUpdated">Cargando…</div>
  </div>
  <button class="refresh-btn" onclick="loadMetrics()">Actualizar</button>
</div>

<!-- Métricas principales -->
<div class="section">
  <div class="section-title">Visión general</div>
  <div class="metrics-grid" id="mainMetrics">
    <div class="state-msg">Cargando…</div>
  </div>
</div>

<!-- Desglose por plan -->
<div class="section">
  <div class="section-title">Usuarios por plan</div>
  <div class="plan-list" id="planBreakdown">
    <div class="state-msg">Cargando…</div>
  </div>
</div>

<!-- Top usuarios -->
<div class="section">
  <div class="section-title">Top usuarios por guiones</div>
  <div id="topUsersWrap">
    <div class="state-msg">Cargando…</div>
  </div>
</div>

<!-- Transcripciones -->
<div class="section">
  <div class="section-title">Transcripciones</div>
  <div class="metrics-grid" id="transMetrics">
    <div class="state-msg">Cargando…</div>
  </div>
  <div style="margin-top:12px" id="transSplit">
    <div class="state-msg">Cargando…</div>
  </div>
  <div style="margin-top:12px" id="transTopWrap">
    <div class="state-msg">Cargando…</div>
  </div>
</div>

<!-- Competencia -->
<div class="section">
  <div class="section-title">Competencia</div>
  <div class="metrics-grid" id="compMetrics">
    <div class="state-msg">Cargando…</div>
  </div>
  <div style="margin-top:12px" id="compRankingWrap">
    <div class="state-msg">Cargando…</div>
  </div>
</div>

<script>
  const PLAN_ORDER = ["agency", "creator", "pro", "free"];
  const PLAN_COLOR = { agency: "#f97316", creator: "#a855f7", pro: "#3b82f6", free: "#9b9b98" };

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  async function loadMetrics() {
    document.getElementById("lastUpdated").textContent = "Actualizando…";
    try {
      const r = await fetch("/admin/metrics");
      if (!r.ok) throw new Error(r.status + " " + r.statusText);
      const d = await r.json();
      renderMain(d);
      renderPlans(d.m3_plan_breakdown);
      renderTopUsers(d.m5_top_users);
      renderTranscriptions(d);
      renderCompetencia(d);
      document.getElementById("lastUpdated").textContent =
        "Actualizado " + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      document.getElementById("mainMetrics").innerHTML =
        `<div class="state-msg error">Error: ${esc(e.message)}</div>`;
      document.getElementById("lastUpdated").textContent = "Error al cargar";
    }
  }

  function renderMain(d) {
    const cards = [
      { label: "Usuarios totales",      value: d.m1_total_users,   accent: false },
      { label: "Nuevos (7 días)",        value: d.m2_new_users_7d,  accent: true  },
      { label: "Guiones creados",        value: d.m4_total_scripts, accent: false },
      { label: "Ideas creadas",          value: d.m6_total_ideas,   accent: false },
      { label: "Suscripciones Stripe",   value: d.m7_stripe_active, accent: false },
    ];
    document.getElementById("mainMetrics").innerHTML = cards.map(c =>
      `<div class="metric-card">
        <div class="metric-label">${esc(c.label)}</div>
        <div class="metric-value${c.accent ? " accent" : ""}">${c.value ?? "—"}</div>
      </div>`
    ).join("");
  }

  function renderPlans(breakdown) {
    if (!breakdown || !Object.keys(breakdown).length) {
      document.getElementById("planBreakdown").innerHTML = '<div class="state-msg">Sin datos</div>';
      return;
    }
    const total = Object.values(breakdown).reduce((a, b) => a + b, 0);
    const plans = PLAN_ORDER.filter(p => breakdown[p] != null);
    // Añadir cualquier plan desconocido al final
    Object.keys(breakdown).forEach(p => { if (!PLAN_ORDER.includes(p)) plans.push(p); });

    document.getElementById("planBreakdown").innerHTML = plans.map(p => {
      const count = breakdown[p] || 0;
      const pct   = total > 0 ? (count / total * 100).toFixed(1) : 0;
      const color = PLAN_COLOR[p] || "#9b9b98";
      return `<div class="plan-row">
        <span class="plan-name">${esc(p.charAt(0).toUpperCase() + p.slice(1))}</span>
        <div class="plan-bar-wrap">
          <div class="plan-bar" style="width:${pct}%;background:${color}"></div>
        </div>
        <span class="plan-count">${count}</span>
      </div>`;
    }).join("");
  }

  function renderTopUsers(users) {
    if (!users || !users.length) {
      document.getElementById("topUsersWrap").innerHTML = '<div class="state-msg">Sin datos</div>';
      return;
    }
    const rows = users.map((u, i) =>
      `<tr>
        <td class="rank">${i + 1}</td>
        <td>${esc(u.email)}</td>
        <td class="count">${u.scripts}</td>
      </tr>`
    ).join("");
    document.getElementById("topUsersWrap").innerHTML =
      `<table class="top-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Usuario</th>
            <th style="text-align:right">Guiones</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function renderTranscriptions(d) {
    // T1: 3 cards
    document.getElementById("transMetrics").innerHTML = [
      { label: "Total histórico",  value: d.t1_total,  accent: false },
      { label: "Esta semana",      value: d.t1_week,   accent: true  },
      { label: "Este mes",         value: d.t1_month,  accent: false },
      { label: "Media por usuario",value: d.t2_avg_per_user != null ? d.t2_avg_per_user.toFixed(2) : "—", accent: false },
    ].map(c =>
      `<div class="metric-card">
        <div class="metric-label">${esc(c.label)}</div>
        <div class="metric-value${c.accent ? " accent" : ""}">${c.value ?? "—"}</div>
      </div>`
    ).join("");

    // T3: split por plataforma (barras reutilizando .plan-row)
    const sp = d.t3_split;
    if (sp) {
      document.getElementById("transSplit").innerHTML =
        `<div class="plan-list">
          <div class="plan-row">
            <span class="plan-name">Instagram</span>
            <div class="plan-bar-wrap">
              <div class="plan-bar" style="width:${sp.instagram_pct}%;background:#f97316"></div>
            </div>
            <span class="plan-count">${sp.instagram} <span style="color:var(--text-tertiary);font-weight:400">(${sp.instagram_pct}%)</span></span>
          </div>
          <div class="plan-row">
            <span class="plan-name">TikTok</span>
            <div class="plan-bar-wrap">
              <div class="plan-bar" style="width:${sp.tiktok_pct}%;background:#3b82f6"></div>
            </div>
            <span class="plan-count">${sp.tiktok} <span style="color:var(--text-tertiary);font-weight:400">(${sp.tiktok_pct}%)</span></span>
          </div>
        </div>`;
    }

    // T2: top transcriptores
    const top = d.t2_top;
    if (!top || !top.length) {
      document.getElementById("transTopWrap").innerHTML = '<div class="state-msg">Sin datos</div>';
      return;
    }
    document.getElementById("transTopWrap").innerHTML =
      `<table class="top-table">
        <thead><tr><th>#</th><th>Usuario</th><th style="text-align:right">Transcripciones</th></tr></thead>
        <tbody>${top.map((u, i) =>
          `<tr>
            <td class="rank">${i + 1}</td>
            <td>${esc(u.email)}</td>
            <td class="count">${u.transcriptions}</td>
          </tr>`
        ).join("")}</tbody>
      </table>`;
  }

  function renderCompetencia(d) {
    // C1: card adopción
    document.getElementById("compMetrics").innerHTML =
      `<div class="metric-card">
        <div class="metric-label">Usuarios usando Competidores</div>
        <div class="metric-value">${d.c1_adopters ?? "—"}</div>
      </div>`;

    // C2/C3: ranking
    const ranking = d.c2c3_ranking;
    if (!ranking || !ranking.length) {
      document.getElementById("compRankingWrap").innerHTML =
        '<div class="state-msg">Ningún usuario ha añadido competidores todavía</div>';
      return;
    }
    if (d.c1_adopters < 3) {
      document.getElementById("compRankingWrap").innerHTML =
        `<div class="state-msg" style="text-align:left;padding:0 0 12px">
          Feature con adopción mínima (${d.c1_adopters} usuario${d.c1_adopters !== 1 ? "s" : ""}).
        </div>` +
        `<table class="top-table">
          <thead><tr><th>#</th><th>Creador (IG)</th><th style="text-align:right">Usuarios</th><th style="text-align:right">Seguidores</th></tr></thead>
          <tbody>${ranking.map((r, i) =>
            `<tr>
              <td class="rank">${i + 1}</td>
              <td>@${esc(r.ig_username)}</td>
              <td class="count">${r.user_count}</td>
              <td class="count" style="color:var(--text-secondary)">${r.followers_count != null ? r.followers_count.toLocaleString("es-ES") : "—"}</td>
            </tr>`
          ).join("")}</tbody>
        </table>`;
      return;
    }
    document.getElementById("compRankingWrap").innerHTML =
      `<table class="top-table">
        <thead><tr><th>#</th><th>Creador (IG)</th><th style="text-align:right">Usuarios</th><th style="text-align:right">Seguidores</th></tr></thead>
        <tbody>${ranking.map((r, i) =>
          `<tr>
            <td class="rank">${i + 1}</td>
            <td>@${esc(r.ig_username)}</td>
            <td class="count">${r.user_count}</td>
            <td class="count" style="color:var(--text-secondary)">${r.followers_count != null ? r.followers_count.toLocaleString("es-ES") : "—"}</td>
          </tr>`
        ).join("")}</tbody>
      </table>`;
  }

  loadMetrics();
</script>
</body>
</html>
