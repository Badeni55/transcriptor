<!DOCTYPE html>
<html lang="{{ lang|default('es') }}">
<head>
  <meta charset="UTF-8" />
  <script>
    (function(){
      try {
        var k = "rs-theme";
        var p = localStorage.getItem(k);
        if (p !== "light" && p !== "dark" && p !== "system") p = "system";
        var resolved = p;
        if (p === "system") {
          resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", resolved);
      } catch(e){
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ s.rp_meta_title }}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/branding/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/static/img/branding/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/branding/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/img/branding/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/branding/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root[data-theme="dark"] {
      --bg: #0a0b0f; --surf: #111318; --surf2: #181b22;
      --border: rgba(255,255,255,0.08); --text: #f1f3f7;
      --text2: #8b92a5; --text3: #4a5168; --accent: #f97316;
      --accent-dim: rgba(249,115,22,0.15);
    }
    :root[data-theme="light"] {
      --bg: #f7f5f1; --surf: #ffffff; --surf2: #f0ede6;
      --border: rgba(0,0,0,0.10); --text: #1a140f;
      --text2: #6b5f52; --text3: #998a78; --accent: #c2410c;
      --accent-dim: rgba(194,65,12,0.10);
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(249,115,22,.2); color: #f97316; }
    .card {
      width: 100%; max-width: 400px;
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px 36px;
    }
    .card h1 {
      font-family: 'DM Serif Display', serif; font-size: 1.6rem; font-weight: 400;
      margin-bottom: 8px;
    }
    .card p { color: var(--text2); font-size: .88rem; margin-bottom: 28px; font-weight: 300; }
    label {
      display: block; font-size: .72rem; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px;
    }
    input {
      width: 100%; padding: 12px 14px; background: var(--surf2);
      border: 1px solid var(--border); border-radius: 10px;
      font-size: 16px; color: var(--text); font-family: 'DM Sans', sans-serif;
      outline: none; transition: border-color .2s; margin-bottom: 12px;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text3); }
    .btn-primary {
      width: 100%; padding: 13px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { background: var(--surf2); color: var(--text3); cursor: not-allowed; }
    .err { font-size: .78rem; color: #f87171; margin-bottom: 12px; display: none; }
    .err.on { display: block; }
    .success { display: none; text-align: center; }
    .success.on { display: block; }
    .success-icon {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent-dim); border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 1.4rem; color: var(--accent);
    }
    .success h2 {
      font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400;
      margin-bottom: 8px;
    }
    .success p { color: var(--text2); font-size: .88rem; font-weight: 300; }
    .no-token { text-align: center; }
    .no-token h2 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 8px; }
    .no-token p { color: var(--text2); font-size: .88rem; margin-bottom: 20px; }
    .no-token a { color: var(--accent); text-decoration: underline; font-size: .88rem; }
  </style>
</head>
<body>
  <div class="card">
    <!-- No token state -->
    <div class="no-token" id="noTokenView" style="display:none">
      <h2>{{ s.rp_invalid_title }}</h2>
      <p>{{ s.rp_invalid_text }}</p>
      <a href="/forgot-password">{{ s.rp_request_new }}</a>
    </div>

    <!-- Form -->
    <div id="formView" style="display:none">
      <h1>{{ s.rp_title }}</h1>
      <p>{{ s.rp_sub }}</p>
      <label>{{ s.rp_pass_label }}</label>
      <input type="password" id="rpPass" placeholder="{{ s.rp_pass_placeholder }}" />
      <label>{{ s.rp_confirm_label }}</label>
      <input type="password" id="rpConfirm" placeholder="{{ s.rp_confirm_placeholder }}" />
      <div class="err" id="rpErr"></div>
      <button class="btn-primary" id="rpBtn" onclick="submitReset()">{{ s.rp_submit }}</button>
    </div>

    <!-- Success -->
    <div class="success" id="successView">
      <div class="success-icon">&#10003;</div>
      <h2>{{ s.rp_success_title }}</h2>
      <p>{{ s.rp_success_text }}</p>
    </div>
  </div>

<script>
const STR = {
  submit: {{ s.rp_submit|tojson }},
  submitting: {{ s.rp_submitting|tojson }},
  min_chars_err: {{ s.rp_min_chars_err|tojson }},
  mismatch_err: {{ s.rp_mismatch_err|tojson }},
  error_generic: {{ s.error_generic|tojson }},
};
let accessToken = "";

function parseToken() {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  accessToken = params.get("access_token") || "";
  if (!accessToken) {
    const q = new URLSearchParams(window.location.search);
    accessToken = q.get("access_token") || "";
  }
  if (accessToken) {
    document.getElementById("formView").style.display = "";
  } else {
    document.getElementById("noTokenView").style.display = "";
  }
}

async function submitReset() {
  const pass = document.getElementById("rpPass").value;
  const confirm = document.getElementById("rpConfirm").value;
  const err = document.getElementById("rpErr");
  const btn = document.getElementById("rpBtn");
  err.classList.remove("on");

  if (pass.length < 6) { err.textContent = STR.min_chars_err; err.classList.add("on"); return; }
  if (pass !== confirm) { err.textContent = STR.mismatch_err; err.classList.add("on"); return; }

  btn.disabled = true; btn.textContent = STR.submitting;
  const res = await fetch("/auth/reset-password", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: accessToken, password: pass }),
  });
  const d = await res.json();
  if (!res.ok) {
    err.textContent = d.error || STR.error_generic; err.classList.add("on");
    btn.disabled = false; btn.textContent = STR.submit;
    return;
  }
  document.getElementById("formView").style.display = "none";
  document.getElementById("successView").classList.add("on");
  setTimeout(() => window.location.href = "/", 3000);
}

document.getElementById("rpConfirm").addEventListener("keydown", e => { if (e.key === "Enter") submitReset(); });
parseToken();
</script>
</body>
</html>
